{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "*" ],
      "dhcp-socket-type": "udp"
    },
    "multi-threading": {
      "enable-multi-threading": true,
      "thread-pool-size": 20,
      "packet-queue-size": 64
    },
    "control-sockets": [
      {
        "socket-type": "http",
        "socket-address": "0.0.0.0",
        "socket-port": 8000,
        "authentication": {
          "type": "basic",
          "realm": "server1-dhcp4",
          "directory": "/etc/kea",
          "clients": [
            {
              "user-file": "api-user",
              "password-file": "api-password"
            }
          ]
        }
      }
    ],

    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "127.0.0.1",
      "server-port": 53001,
      "ncr-protocol": "UDP",
      "ncr-format": "JSON"
    },

    "lease-database": {
      "type": "postgresql",
      "name": "kea_leases",
      "user": "kea",
      "password": "keapass",
      "host": "127.0.0.1",
      "port": 5432
    },
    "hosts-database": {
      "type": "postgresql",
      "name": "kea_db",
      "user": "kea",
      "password": "keapass",
      "host": "192.168.69.2",
      "port": 5432
    },

    "hooks-libraries": [
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ha.so", 
        "parameters": {
          "high-availability": [{
            "this-server-name": "server1",
            "mode": "load-balancing",
            "multi-threading": {
              "enable-multi-threading": true,
              "http-dedicated-listener": true,
              "http-listener-threads": 0,
              "http-client-threads": 0
            },
            "heartbeat-delay": 10000,
            "max-response-delay": 60000,
            "max-ack-delay": 5000,
            "max-unacked-clients": 5,
            "max-rejected-lease-updates": 10,
            "delayed-updates-limit": 100,
            "peers": [{
              "name": "server1",
              "url": "http://192.168.69.10:9000/",
              "basic-auth-user": "kea",
              "basic-auth-password": "keapass",
              "role": "primary",
              "auto-failover": true
            }, {
              "name": "server2",
              "url": "http://192.168.69.11:9000/",
              "basic-auth-user": "kea",
              "basic-auth-password": "keapass",
              "role": "secondary",
              "auto-failover": true
            }]
          }]
        }
      },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_pgsql.so" },
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ddns_tuning.so",
        "parameters": {}
      },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_perfmon.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_stat_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_bootp.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_host_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_class_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_limits.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_subnet_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_query.so",
        "parameters": {
            "requesters": [ "192.0.3.1" ]
         }
      },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_legal_log.so",
        "parameters": {
          "type": "postgresql",
          "name": "kea_db",
          "user": "kea",
          "password": "keapass",
          "host": "192.168.69.2",
          "port": 5432
        }
      }
    ],

    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "ddns-send-updates": true,
    "ddns-override-no-update": true,
    "ddns-override-client-update": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "dynv4",
    "ddns-qualifying-suffix": "example.com",
    "hostname-char-set": "[^A-Za-z0-9-]",
    "hostname-char-replacement": "-",
    "option-data": [
      {
        "name": "domain-name-servers",
        "data": "192.168.69.200, 192.168.69.201"
      },
      {
        "name": "domain-name",
        "data": "example.com"
      },
      {
        "name": "time-servers",
        "data": "64.39.128.36"
      }
    ],
    "subnet4": [{
      "id": 1,
      "subnet": "192.0.3.0/24",
      "pools": [{
          "pool": "192.0.3.100 - 192.0.3.150",
          "client-classes": [ "HA_server1" ]
        }, {
          "pool": "192.0.3.200 - 192.0.3.250",
          "client-classes": [ "HA_server2" ]
        }],
        "option-data": [{
          "name": "routers",
          "data": "192.0.3.1"
        }]
    }],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          {
            "output": "/var/log/kea/dhcp4.log",
            "maxver": 2,
            "maxsize": 204800
          }
        ],
        "severity": "INFO"
      }
    ]
  }
}
