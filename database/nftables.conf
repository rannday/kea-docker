flush ruleset

table inet filter {
  set management {
    type ipv4_addr
    flags interval
    elements = { 172.17.1.0/24, 172.17.2.0/24 }
  }

  chain input {
    type filter hook input priority filter; policy drop;

    iif lo accept
    ct state invalid drop
    ct state { established, related } accept
    ip protocol icmp accept

    meta l4proto tcp jump input_tcp
    meta l4proto udp jump input_udp
  }

  chain input_tcp {
    ip saddr 192.168.69.10 tcp dport 5432 accept comment "dhcp1 shared DB access"
    ip saddr 192.168.69.11 tcp dport 5432 accept comment "dhcp2 shared DB access"
    ip saddr 192.168.69.69 tcp dport 5432 accept comment "standby replication"
  }

  chain input_udp {
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
