{
  "DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "dns-server-timeout": 1000,
    "ncr-protocol": "UDP",
    "ncr-format": "JSON",
    "control-sockets": [
      {
        "socket-type": "http",
        "socket-address": "0.0.0.0",
        "socket-port": 8002,
        "authentication": {
          "type": "basic",
          "realm": "server1-ddns",
          "directory": "/etc/kea",
          "clients": [
            {
              "user-file": "api-user",
              "password-file": "api-password"
            }
          ]
        }
      }
    ],

    "tsig-keys": [
      {
        "name": "kea-ddns-key.",
        "algorithm": "HMAC-SHA256",
        "secret-file": "/etc/kea/kea-ddns.key"
      }
    ],

    "forward-ddns": {
      "ddns-domains": [
        {
          "name": "example.com.",
          "key-name": "kea-ddns-key.",
          "dns-servers": [
            {
              "ip-address": "192.168.69.200",
              "port": 53
            }
          ]
        }
      ]
    },

    "reverse-ddns": {
      "ddns-domains": [
        {
          "name": "3.0.192.in-addr.arpa.",
          "key-name": "kea-ddns-key.",
          "dns-servers": [
            {
              "ip-address": "192.168.69.200",
              "port": 53
            }
          ]
        },
        {
          "name": "1.0.0.0.9.6.0.0.9.6.0.0.9.6.d.f.ip6.arpa.",
          "key-name": "kea-ddns-key.",
          "dns-servers": [
            {
              "ip-address": "192.168.69.200",
              "port": 53
            }
          ]
        }
      ]
    },

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output-options": [
          {
            "output": "/var/log/kea/dhcp-ddns.log",
            "maxver": 2,
            "maxsize": 204800
          }
        ],
        "severity": "INFO"
      }
    ]
  }
}
