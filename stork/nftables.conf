flush ruleset

table inet filter {
  set management {
    type ipv4_addr
    flags interval
    elements = { 172.17.1.0/24, 172.17.2.0/24 }
  }

  chain input {
    type filter hook input priority filter; policy drop;

    iif lo accept
    ct state invalid drop
    ct state { established, related } accept
    ip protocol icmp accept

    meta l4proto tcp jump input_tcp
    meta l4proto udp jump input_udp
  }

  chain input_tcp {
    ip saddr 192.168.69.1 tcp dport { 8080, 9090, 3000 } accept comment "host localhost-published dashboards"
    ip saddr @management tcp dport { 8080, 9090, 3000 } accept comment "management dashboards"
    ip saddr { 192.168.69.10, 192.168.69.11 } tcp dport 8080 accept comment "Stork agents"
  }

  chain input_udp {
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
