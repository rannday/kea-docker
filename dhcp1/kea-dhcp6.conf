{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [ "*" ],
      "re-detect": false
    },
    "multi-threading": {
      "enable-multi-threading": true,
      "thread-pool-size": 20,
      "packet-queue-size": 64
    },
    "control-sockets": [
      {
        "socket-type": "http",
        "socket-address": "0.0.0.0",
        "socket-port": 8001,
        "authentication": {
          "type": "basic",
          "realm": "server1-dhcp6",
          "directory": "/etc/kea",
          "clients": [
            {
              "user-file": "api-user",
              "password-file": "api-password"
            }
          ]
        }
      }
    ],

    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "127.0.0.1",
      "server-port": 53001,
      "ncr-protocol": "UDP",
      "ncr-format": "JSON"
    },

    "lease-database": {
      "type": "postgresql",
      "name": "kea_leases",
      "user": "kea",
      "password": "keapass",
      "host": "127.0.0.1",
      "port": 5432
    },
    "hosts-database": {
      "type": "postgresql",
      "name": "kea_db",
      "user": "kea",
      "password": "keapass",
      "host": "192.168.69.2",
      "port": 5432
    },
    
    "hooks-libraries": [
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ha.so",
        "parameters": {
          "high-availability": [{
            "this-server-name": "server1",
            "mode": "load-balancing",
            "multi-threading": {
              "enable-multi-threading": true,
              "http-dedicated-listener": true,
              "http-listener-threads": 0,
              "http-client-threads": 0
            },
            "heartbeat-delay": 10000,
            "max-response-delay": 60000,
            "max-ack-delay": 5000,
            "max-unacked-clients": 5,
            "max-rejected-lease-updates": 10,
            "delayed-updates-limit": 100,
            "peers": [{
              "name": "server1",
              "url": "http://192.168.69.10:9001/",
              "basic-auth-user": "kea",
              "basic-auth-password": "keapass",
              "role": "primary",
              "auto-failover": true
            }, {
              "name": "server2",
              "url": "http://192.168.69.11:9001/",
              "basic-auth-user": "kea",
              "basic-auth-password": "keapass",
              "role": "secondary",
              "auto-failover": true
            }]
          }]
        }
      },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_pgsql.so" },
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ddns_tuning.so",
        "parameters": {}
      },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_perfmon.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_stat_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_host_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_class_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_limits.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_subnet_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_query.so",
        "parameters": {
            "requesters": [ "fd69:69:69:1::1" ]
         }
      },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_legal_log.so",
        "parameters": {
          "type": "postgresql",
          "name": "kea_db",
          "user": "kea",
          "password": "keapass",
          "host": "192.168.69.2",
          "port": 5432
        }
      }
    ],

    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "ddns-send-updates": true,
    "ddns-override-no-update": true,
    "ddns-override-client-update": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "dynv6",
    "ddns-qualifying-suffix": "example.com",
    "hostname-char-set": "[^A-Za-z0-9-]",
    "hostname-char-replacement": "-",
    "option-data": [
      {
        "name": "dns-servers",
        "data": "fd69:69:69::200, fd69:69:69::201"
      }
    ],
    "subnet6": [{
      "id": 1,
      "subnet": "fd69:69:69:1::/64",
      "pools": [{
        "pool": "fd69:69:69:1::1000 - fd69:69:69:1::17ff",
        "client-classes": [ "HA_server1" ]
      },{
        "pool": "fd69:69:69:1::1800 - fd69:69:69:1::1fff",
        "client-classes": [ "HA_server2" ]
      }]
    }],

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output-options": [
          {
            "output": "/var/log/kea/dhcp6.log",
            "maxver": 2,
            "maxsize": 204800
          }
        ],
        "severity": "INFO"
      }
    ]
}
}
