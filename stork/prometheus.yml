global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kea
    static_configs:
      - targets:
          - 192.168.69.10:9547
          - 192.168.69.11:9547

  - job_name: storkserver
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8080

  - job_name: bind
    static_configs:
      - targets:
          - 192.168.69.200:9119
          - 192.168.69.201:9119
