{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [ "*" ],
      "re-detect": false
    },
    "control-sockets": [
      {
        "socket-type": "http",
        "socket-address": "0.0.0.0",
        "socket-port": 9000,
        "authentication": {
          "type": "basic",
          "realm": "kea1-dhcp6",
          "clients": [
            {
              "user": "kea",
              "password": "keapass"
            }
          ]
        }
      }
    ],

    "lease-database": {
      "type": "postgresql",
      "name": "kea_leases",
      "user": "kea",
      "password": "keapass",
      "host": "127.0.0.1",
      "port": 5432
    },
    "hosts-database": {
      "type": "mysql",
      "name": "kea-hosts",
      "user": "kea",
      "password": "keapass",
      "host": "192.168.69.2",
      "port": 3306
    },
    
    "hooks-libraries": [
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ha.so",
        "parameters": {
          "high-availability": [{
            "this-server-name": "server1",
            "mode": "load-balancing",
            "heartbeat-delay": 10000,
            "max-response-delay": 60000,
            "max-ack-delay": 5000,
            "max-unacked-clients": 5,
            "max-rejected-lease-updates": 10,
            "delayed-updates-limit": 100,
            "peers": [{
              "name": "server1",
              "url": "http://192.168.69.10:9100/",
              "basic-auth-user": "kea",
              "basic-auth-password": "keapass",
              "role": "primary",
              "auto-failover": true
            }, {
              "name": "server2",
              "url": "http://192.168.69.11:9101/",
              "basic-auth-user": "kea",
              "basic-auth-password": "keapass",
              "role": "secondary",
              "auto-failover": true
            }]
          }]
        }
      },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_mysql.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_pgsql.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_perfmon.so" },
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_stat_cmds.so" }
    ],

    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "option-data": [
      {
        "name": "dns-servers",
        "data": "2001:4860:4860::8888, 2001:4860:4860::8844"
      }
    ],
    "subnet6": [{
      "id": 1,
      "subnet": "fd69:69:69:1::/64",
      "pools": [{
        "pool": "fd69:69:69:1::1000 - fd69:69:69:1::17ff",
        "client-classes": [ "HA_server1" ]
      },{
        "pool": "fd69:69:69:1::1800 - fd69:69:69:1::1fff",
        "client-classes": [ "HA_server2" ]
      }]
    }],

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output-options": [
          {
            "output": "/var/log/kea/dhcp6.log"
          }
        ],
        "severity": "INFO"
      }
    ]
}
}